name: Android checks and nightly

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test and build
        run: bash gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="auto build · ${GITHUB_SHA:0:7} · ${GITHUB_REF_NAME} · unsigned APK"
          # --target updates release metadata, not the existing Git tag ref.
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            # Update in place so the release URL and its download link survive
            # every build, and a failure cannot leave the project without one.
            gh release upload nightly apk/app-release-unsigned.apk --clobber
            gh release edit nightly --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create nightly apk/app-release-unsigned.apk \
              --title "Nightly Build" --notes "$notes" \
              --prerelease --target "$GITHUB_SHA"
          fi
