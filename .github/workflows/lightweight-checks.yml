name: Web and script checks

on:
  push:
    branches: ["main"]
    paths: ["web/**", "scripts/**", "tests/**", ".github/workflows/lightweight-checks.yml"]
  pull_request:
    paths: ["web/**", "scripts/**", "tests/**", ".github/workflows/lightweight-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/web.test.cjs
