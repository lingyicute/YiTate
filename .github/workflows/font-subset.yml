name: Font Subsetting & Embed

on:
  push:
    branches: ["main"]
    paths:
      - "web/index.html"
      - "scripts/subset_font.py"
      - "scripts/requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: font-subset-main
  cancel-in-progress: false

jobs:
  subset-and-embed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Subset font from latest branch head and push if changed
        env:
          GIT_USER_NAME: ${{ github.actor }}
          GIT_USER_EMAIL: ${{ github.event.pusher.email || format('{0}@users.noreply.github.com', github.actor) }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          # Regenerate against the latest branch tip instead of rebasing a 78 KB
          # single-line @font-face diff when queued runs land back-to-back.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
            python scripts/subset_font.py
            if git diff --quiet web/index.html; then
              echo "No changes in web/index.html detected."
              exit 0
            fi
            git add web/index.html
            git commit -m "perf: 更新 Nebulove 字体子集"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push raced with a newer commit (attempt $attempt); retrying."
          done
          exit 1
