# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "scripts/subset_font.py"
      - "scripts/requirements.txt"
      - "scripts/check_pages_revision.sh"
      - "tests/web.test.cjs"
      - "tests/test_subset_font.py"
      - "tests/test_pages_revision.py"
      - ".github/workflows/static.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # Build the font from this checkout without committing generated data to main.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - name: Verify the font generator and deployment guard
        run: |
          python -m unittest discover -s tests -p 'test_subset_font.py' -v
          python -m unittest discover -s tests -p 'test_pages_revision.py' -v
      - name: Generate font for this deployment
        run: python scripts/subset_font.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Test the generated page
        run: node --test tests/web.test.cjs
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - name: Name the artifact for this build attempt
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: './web'
  deploy:
    # Serialize writes without replacing a pending run with a stale rerun.
    concurrency:
      group: pages
      queue: max
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout the built revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Compare with the current Pages inputs on main
        id: current
        run: bash scripts/check_pages_revision.sh
      - name: Deploy to GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
        with:
          # Deploy-only reruns must reuse the output of the earlier successful build.
          artifact_name: ${{ needs.build.outputs.artifact_name }}
